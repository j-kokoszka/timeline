<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c28"/>
      <stop offset="100%" stop-color="#0b0d13"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="axisLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#d9a74a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#d9a74a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Box -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="url(#goldGlow)" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Timeline Horizontal Axis Line -->
  <line x1="64" y1="256" x2="448" y2="256" stroke="url(#axisLine)" stroke-width="12" stroke-linecap="round"/>

  <!-- Year Ticks -->
  <line x1="120" y1="232" x2="120" y2="280" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round"/>
  <line x1="392" y1="232" x2="392" y2="280" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>

  <!-- Central Star Compass Badge -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="88" fill="#1e2332" stroke="url(#goldGlow)" stroke-width="10"/>
    <!-- 8-Point Compass Star -->
    <path d="M 256 186 L 270 242 L 326 256 L 270 270 L 256 326 L 242 270 L 186 256 L 242 242 Z" fill="url(#goldGlow)"/>
  </g>

  <!-- Multi-Discipline Glowing Dots -->
  <circle cx="120" cy="180" r="18" fill="#8b5cf6"/>
  <circle cx="256" cy="125" r="18" fill="#d9a74a"/>
  <circle cx="392" cy="180" r="18" fill="#10b981"/>
  <circle cx="320" cy="330" r="18" fill="#0284c7"/>
</svg>
